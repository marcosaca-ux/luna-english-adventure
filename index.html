<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. A fixed "stage" (Luna + speech bubble) on top, the game view below. Single light theme by choice: a soft morning sky. */
:root{
  color-scheme: light;
  --sky:#e6f3ff; --sky2:#fff3ea; --ink:#2e2a55; --soft:#6b6791;
  --card:#ffffff; --line:#d9def2;
  --berry:#e2557f; --grape:#7a5cd6; --mint:#22b598; --sun:#ffc533; --peach:#ffd9c7;
  --fur:#fff6dc; --pink:#ffb3c7;
  --ok:#1fa67a; --okbg:#dff7ec; --no:#e2557f; --nobg:#ffe6ee;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%) fixed;background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 28px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.bar h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;flex:1;line-height:1.1;text-wrap:balance}
.bar h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;color:var(--soft)}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;min-height:44px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:20px;display:grid;place-items:center}

/* stage */
.stage{display:flex;align-items:flex-end;gap:8px;padding:6px 0 12px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--sky) 78%,rgba(230,243,255,0))}
.lunaBtn{flex:0 0 96px;width:96px;padding:0}
.luna{width:96px;height:88px;display:block;filter:drop-shadow(0 4px 0 rgba(122,92,214,.18))}
.luna .eyes-laugh,.luna .mouth-talk,.luna .mouth-laugh{display:none}
.luna .eyes-open{transform-origin:60px 56px;animation:blink 4.5s infinite}
.talking .luna .mouth-smile{display:none}
.talking .luna .mouth-talk{display:block;transform-origin:60px 79px;animation:talk .28s infinite alternate}
.laugh .luna .eyes-open,.laugh .luna .mouth-smile,.laugh .luna .mouth-talk{display:none}
.laugh .luna .eyes-laugh,.laugh .luna .mouth-laugh{display:block}
.laugh .luna{animation:wobble .18s 6 alternate}
.happy .luna{animation:hop .5s 1}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
@keyframes wobble{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.bubble{flex:1;background:var(--card);border:2px solid var(--line);border-radius:var(--r);border-bottom-left-radius:6px;padding:12px 14px;font-weight:700;min-height:64px;position:relative}
.bubble .en{font-family:var(--display);font-weight:800;font-size:19px;color:var(--grape);display:block;line-height:1.15}
.bubble .pt{display:block;color:var(--ink);font-size:15.5px}
.bubble.jokey{background:#fff8d9;border-color:var(--sun)}

/* home */
.world{margin-top:14px}
.world h2{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.world h2 span{font-family:var(--body);font-size:13px;font-weight:800;color:var(--soft)}
.world p{margin:0 0 10px;color:var(--soft);font-size:14.5px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:112px}
.tile:active{transform:translateY(2px);border-bottom-width:3px}
.tile .ic{font-size:30px;line-height:1}
.tile b{font-family:var(--display);font-size:17px;line-height:1.1}
.tile i{font-style:normal;font-size:13px;color:var(--soft);font-weight:700}
.tile .st{margin-top:auto;font-size:15px;letter-spacing:2px;color:var(--sun)}
.tile .st .off{color:var(--line)}
.w7 .tile{border-color:#bfe9df}.w8 .tile{border-color:#d6cbf6}
.tile.done{background:linear-gradient(180deg,#fff,#fffbe8)}
.foot{margin-top:22px;font-size:13.5px;color:var(--soft);font-weight:700;border-top:2px dashed var(--line);padding-top:12px}

/* welcome */
.welcome{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.welcome label{font-weight:800}
.welcome input{font:inherit;font-weight:800;padding:12px 14px;border-radius:14px;border:2px solid var(--line);width:100%;color:var(--ink);background:#fbfcff}
.big{background:var(--grape);color:#fff;font-family:var(--display);font-weight:800;font-size:21px;border-radius:999px;padding:12px 20px;min-height:54px;border-bottom:5px solid #5a3fb4;width:100%}
.big:active{transform:translateY(2px);border-bottom-width:3px}
.big.mint{background:var(--mint);border-bottom-color:#168a73}
.big.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.big[disabled]{opacity:.45}

/* game */
.prog{height:12px;background:var(--card);border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:2px 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:99px;transition:width .4s}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.qcard .em{font-size:56px;line-height:1.05}
.qcard .q{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2;text-wrap:balance}
.qcard .sub{color:var(--soft);font-weight:700;font-size:15px}
.blank{display:inline-block;min-width:74px;border-bottom:4px dotted var(--grape);color:var(--grape);padding:0 4px}
.blank.fill{border-bottom-style:solid;border-color:var(--ok);color:var(--ok)}
.hear{display:flex;gap:8px;justify-content:center;margin-top:4px}
.hear button{background:#f1edff;border:2px solid #d6cbf6;border-radius:999px;padding:8px 14px;font-weight:800;min-height:44px}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px;font-weight:800;font-size:19px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.opt .e{font-size:44px;line-height:1}
.opt:active{transform:translateY(2px);border-bottom-width:3px}
.opt.good{background:var(--okbg);border-color:var(--ok);color:#0d6b4d}
.opt.bad{background:var(--nobg);border-color:var(--no);color:#a3294f;animation:shake .35s;opacity:.7}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.next{margin-top:14px}

/* learn */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;position:relative}
.fc .e{font-size:42px;line-height:1.1}
.fc b{font-family:var(--display);font-size:18px;line-height:1.1}
.fc i{font-style:normal;color:var(--soft);font-size:13.5px;font-weight:700;min-height:18px}
.fc.seen{border-color:var(--mint);background:#f3fffb}
.fc.seen::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--mint);font-weight:800}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:1/1;border-radius:16px;border:2px solid #d6cbf6;border-bottom-width:5px;background:linear-gradient(135deg,#8f73e6,#b79df5);color:#fff;font-size:30px;font-weight:800;display:grid;place-items:center;padding:4px;text-align:center;line-height:1.05;overflow-wrap:anywhere}
.mc.up{background:var(--card);color:var(--ink);border-color:var(--line)}
.mc.up.w{font-family:var(--display);font-size:16px}
.mc.up.e{font-size:40px}
.mc.match{background:var(--okbg);border-color:var(--ok)}

/* builder */
.line{min-height:66px;background:var(--card);border:2px dashed #d6cbf6;border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.line.good{border:2px solid var(--ok);background:var(--okbg)}
.line.bad{animation:shake .35s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chip{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 14px;font-weight:800;font-size:18px;min-height:46px}
.line .chip{background:#f1edff;border-color:#d6cbf6}
.ptline{text-align:center;color:var(--soft);font-weight:700;font-size:15px}

/* story */
.tv{background:#2e2a55;border-radius:26px;padding:10px;box-shadow:0 6px 0 rgba(46,42,85,.25)}
.screen{height:200px;border-radius:18px;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:0 8px 26px;position:relative;overflow:hidden}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:rgba(46,42,85,.13)}
.bg-hospital{background:linear-gradient(180deg,#d6efff,#f6fcff)}
.bg-park{background:linear-gradient(180deg,#aee0ff,#d5f6c2)}
.bg-home{background:linear-gradient(180deg,#ffe3cc,#fff6e6)}
.bg-sky{background:linear-gradient(180deg,#8fcbff,#e3f5ff)}
.bg-beach{background:linear-gradient(180deg,#a5ddff 0 58%,#ffe5a0 58% 100%)}
.bg-world{background:linear-gradient(180deg,#c6d6ff,#f0e6ff)}
.bg-end{background:linear-gradient(180deg,#7a5cd6,#b79df5)}
.act{font-size:60px;line-height:1;position:relative;z-index:1;display:inline-block;animation-fill-mode:both}
.a-in{animation:sIn .7s ease-out both}
.a-hop{animation:sHop .7s ease-in-out infinite}
.a-shake{animation:sShake .35s ease-in-out infinite alternate}
.a-float{animation:sFloat 2s ease-in-out infinite}
.a-spin{animation:sSpin 2.4s linear infinite}
.a-zoom{animation:sZoom 1.1s ease-in-out infinite}
.a-pop{animation:sPop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes sIn{from{transform:translateX(-160px)}to{transform:none}}
@keyframes sHop{50%{transform:translateY(-22px)}}
@keyframes sShake{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes sFloat{50%{transform:translateY(-34px)}}
@keyframes sSpin{to{transform:rotate(360deg)}}
@keyframes sZoom{50%{transform:scale(1.25)}}
@keyframes sPop{from{transform:scale(.2)}to{transform:none}}
.cap{background:var(--card);border-radius:16px;margin-top:10px;padding:12px;text-align:center;min-height:98px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.cen{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2;text-wrap:balance}
.cen mark{background:#fff0a8;color:var(--grape);border-radius:6px;padding:0 4px}
.cpt{color:var(--soft);font-weight:700;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:#5b568c}
.dots i.on{background:var(--sun)}
.skip{display:block;margin:10px auto 0;color:var(--soft);font-weight:800;min-height:44px;text-decoration:underline}
.next .big+.big{margin-top:10px}

/* speak */
.mic{background:var(--berry);border-bottom-color:#b53a61}
.mic.on{animation:pulse 1s infinite;background:#c4426c}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(226,85,127,.18)}}
.heard{min-height:30px;text-align:center;font-weight:800;color:var(--grape);margin-top:10px;font-size:17px}
.note{background:#fff8d9;border:2px solid var(--sun);border-radius:16px;padding:10px 12px;font-size:14.5px;font-weight:700;margin:0 0 10px}

/* done */
.done{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big+.big{margin-top:0}
.done .stars{font-size:52px;letter-spacing:6px;color:var(--sun)}
.done .stars .off{color:var(--line)}
.done h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.1}
.done p{margin:0;font-weight:700;color:var(--soft)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.opt{font-size:17px}.qcard .q{font-size:21px}.lunaBtn{flex-basis:80px;width:80px}.luna{width:80px;height:74px}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="iconbtn" id="back" aria-label="Voltar ao mapa" hidden>←</button>
    <h1 id="title">Luna English Adventure<small>Inglês brincando</small></h1>
    <div class="pill" aria-label="Estrelas">⭐ <span id="total">0</span></div>
    <button class="iconbtn" id="mute" aria-label="Ligar ou desligar a voz">🔊</button>
  </div>
  <div class="stage" id="stage">
    <button class="lunaBtn" id="lunaBtn" aria-label="Luna, toque para ouvir de novo">
      <svg class="luna" viewBox="0 0 120 110" aria-hidden="true">
        <path d="M22 46 L16 8 L50 26 Z" fill="var(--fur)" stroke="#e9d9a8" stroke-width="2"/>
        <path d="M98 46 L104 8 L70 26 Z" fill="var(--fur)" stroke="#e9d9a8" stroke-width="2"/>
        <path d="M26 34 L23 17 L40 26 Z" fill="var(--pink)"/><path d="M94 34 L97 17 L80 26 Z" fill="var(--pink)"/>
        <ellipse cx="60" cy="64" rx="47" ry="42" fill="var(--fur)" stroke="#e9d9a8" stroke-width="2"/>
        <g class="eyes-open"><ellipse cx="43" cy="56" rx="6" ry="8" fill="#2e2a55"/><ellipse cx="77" cy="56" rx="6" ry="8" fill="#2e2a55"/><circle cx="45" cy="53" r="2.3" fill="#fff"/><circle cx="79" cy="53" r="2.3" fill="#fff"/></g>
        <g class="eyes-laugh" fill="none" stroke="#2e2a55" stroke-width="3.6" stroke-linecap="round"><path d="M36 59 Q43 48 50 59"/><path d="M70 59 Q77 48 84 59"/></g>
        <ellipse cx="29" cy="72" rx="8" ry="5" fill="var(--pink)" opacity=".75"/><ellipse cx="91" cy="72" rx="8" ry="5" fill="var(--pink)" opacity=".75"/>
        <path d="M55.5 66 L64.5 66 L60 71.5 Z" fill="#e2557f"/>
        <path class="mouth-smile" d="M50 76 Q60 86 70 76" fill="none" stroke="#2e2a55" stroke-width="3" stroke-linecap="round"/>
        <ellipse class="mouth-talk" cx="60" cy="80" rx="6.5" ry="5.5" fill="#7a2f4a"/>
        <path class="mouth-laugh" d="M47 75 Q60 99 73 75 Z" fill="#7a2f4a"/>
        <g stroke="#cdbb86" stroke-width="1.6" stroke-linecap="round"><path d="M14 64 L2 61"/><path d="M14 70 L2 72"/><path d="M106 64 L118 61"/><path d="M106 70 L118 72"/></g>
        <path d="M60 22 q6 -9 13 -3 q-9 1 -7 9 q-6 -1 -6 -6z" fill="var(--sun)"/>
      </svg>
    </button>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </div>
  <main id="view"></main>
</div>
<div class="conf" id="conf"></div>

<script>
"use strict";
/* ================= CONTENT (from the book pages: units 7 and 8) ================= */
const HEALTH=[
 {e:"👂",en:"earache",pt:"dor de ouvido",joke:"Ear é orelha e ache é dor. Earache é a orelha reclamando de tanto ouvir: arruma o quarto!"},
 {e:"🤕",en:"headache",pt:"dor de cabeça",joke:"Head é cabeça. Headache é o que a cabeça sente quando aparece a tabuada do sete!"},
 {e:"🤧",en:"cold",pt:"resfriado",joke:"Cold é frio e também é resfriado. O nariz vira torneirinha. Atchim!"},
 {e:"🦷",en:"toothache",pt:"dor de dente",joke:"Tooth é dente. Toothache é o dente gritando: chega de bala!"},
 {e:"🤢",en:"stomachache",pt:"dor de barriga",joke:"Stomach é estômago. Stomachache é a barriga dizendo: quem mandou comer a pizza inteira?"},
 {e:"😷",en:"cough",pt:"tosse",joke:"Cough se fala cóf. Parece o barulhinho da tosse: cof, cof, cof!"},
 {e:"🩺",en:"doctor",pt:"médico ou médica",joke:"Doctor é quase igual a doutor. As letras só trocaram de cadeira!"},
 {e:"💉",en:"nurse",pt:"enfermeira ou enfermeiro",joke:"Nurse é quem cuida da gente no hospital, com muito carinho e, às vezes, uma injeçãozinha. Ui!"}
];
const COUNTRIES=[
 {e:"🇪🇬",en:"Egypt",pt:"Egito",joke:"Por que a múmia não tira férias? Porque tem medo de relaxar e se desenrolar! Ela mora no Egypt, o Egito."},
 {e:"🇦🇷",en:"Argentina",pt:"Argentina",joke:"Argentina escreve igualzinho em português. Essa foi presente dos nossos vizinhos!"},
 {e:"🇮🇳",en:"India",pt:"Índia",joke:"India é a Índia, terra do Taj Mahal, um palácio tão branquinho que parece feito de leite!"},
 {e:"🇦🇺",en:"Australia",pt:"Austrália",joke:"Australia é a terra dos cangurus. Lá até a mochila da mamãe canguru vem de fábrica!"},
 {e:"🇲🇽",en:"Mexico",pt:"México",joke:"Mexico é a terra dos tacos. Ai, só de falar já deu fome!"},
 {e:"🇧🇷",en:"Brazil",pt:"Brasil",joke:"Em inglês, Brazil é com Z. O S ficou na praia tomando água de coco!"},
 {e:"🇨🇱",en:"Chile",pt:"Chile",joke:"Chile em inglês soa como chili, a pimenta. Um país bem comprido e apimentado!"},
 {e:"🇪🇸",en:"Spain",pt:"Espanha",joke:"Spain é a Espanha. Os ingleses ficaram com fome e comeram o E do começo!"},
 {e:"🇨🇳",en:"China",pt:"China",joke:"A muralha da China é tão comprida que não cabe na foto, nem com o braço esticado!"},
 {e:"🇹🇷",en:"Turkey",pt:"Turquia",joke:"Turkey é a Turquia, mas também quer dizer peru! Um país com nome de ave. Glu, glu, glu!"}
];
const REG_J=["Verbo regular no passado é fácil: é só colar um e-d no final, igual figurinha!","O e-d é o pijama do verbo. Ele veste quando o dia já acabou!","Ontem já passou, então o verbo ganha um rabinho: e-d!","Quase! Com i-n-g a coisa está acontecendo agora. Para ontem, a gente usa e-d!"];
const reg=(v,pt,s,ing,es,j)=>({q:s,sub:v+" = "+pt,say:v,opts:[v.endsWith("e")?v+"d":v+"ed",ing,es],a:v.endsWith("e")?v+"d":v+"ed",ok:s.replace("___",v.endsWith("e")?v+"d":v+"ed"),joke:j});
const REGULAR=[
 reg("play","jogar, brincar","Yesterday, I ___ soccer.","playing","plays"),
 reg("shout","gritar","The boy ___ 'Help!'","shouting","shouts"),
 reg("land","pousar, cair em","The bird ___ on the tree.","landing","lands"),
 reg("jump","pular","The frog ___ into the water.","jumping","jumps"),
 reg("look","olhar","She ___ at the stars.","looking","looks"),
 reg("smile","sorrir","The baby ___ at me.","smiling","smiles","Smile já termina com a letra E, então só ganha um D. Economia de letra!"),
 reg("climb","subir, escalar","We ___ a big tree.","climbing","climbs"),
 reg("rest","descansar","Grandpa ___ on the sofa.","resting","rests"),
 reg("watch","assistir","I ___ a movie last night.","watching","watches"),
 reg("listen","escutar","We ___ to music.","listening","listens"),
 reg("visit","visitar","They ___ their grandma.","visiting","visits"),
 reg("call","ligar, chamar","Mom ___ the doctor.","calling","calls"),
 reg("walk","andar","I ___ to school yesterday.","walking","walks")
];
const irr=(v,pt,s,past,wrong,es,j)=>({q:s,sub:v+" = "+pt,say:v,opts:[past,wrong,es],a:past,ok:s.replace("___",past),joke:j});
const IRREGULAR=[
 irr("go","ir","Yesterday, I ___ to the doctor.","went","goed","goes","Goed não existe! O go é rebelde: no passado ele se disfarça e vira went. Nem parece o mesmo verbo!"),

let ac=null;
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(f,t,d,g=.12,type="sine",f2){const a=audio();if(!a||muted)return;try{const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t+d);v.gain.setValueAtTime(0,a.currentTime+t);v.gain.linearRampToValueAtTime(g,a.currentTime+t+.02);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(v).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)}catch(e){}}
const giggle=()=>[980,1100,940,1060,900,1020,820].forEach((f,i)=>tone(f,i*.105,.09,.1,"triangle",f*.86));
const ding=()=>{tone(784,0,.14,.12);tone(1175,.12,.28,.12)};

const micMode=()=>dict?"dict":(SR&&!srDead?"web":null);
(function findTTS(n){if(window.claude&&typeof window.claude.use==="function"){window.claude.use("tts").then(t=>{ctts=t||null}).catch(()=>{});
  window.claude.use("dictation").then(d=>{dict=d||null;if(!dict)return;try{dict.onFinal(e=>dictH&&dictH("final",e.text));dict.onPartial(e=>dictH&&dictH("partial",e.text));dict.onState(e=>dictH&&dictH("state",e.state,e.reason))}catch(e){}}).catch(()=>{})}else if(n<24)setTimeout(()=>findTTS(n+1),500)})(0);
const hasWeb="speechSynthesis" in window;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if(hasWeb){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
const SOFT_EN=["Samantha","Google US English","Aria","Jenny","Ava","Allison","Karen","Moira","Tessa","Zira","Female"];
const SOFT_PT=["Luciana","Francisca","Google português do Brasil","Fernanda","Maria"];
function voiceFor(l){const pre=l==="pt"?"pt":"en";const list=voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(pre));if(!list.length)return null;const names=l==="pt"?SOFT_PT:SOFT_EN;for(const n of names){const v=list.find(x=>x.name.includes(n));if(v)return v}return list.find(v=>/br|us/i.test(v.lang))||list[0]}
function webSay(parts,my){if(!hasWeb)return Promise.resolve();try{speechSynthesis.cancel()}catch(e){}
  return parts.reduce((p,x)=>p.then(()=>my!==tok?null:new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};try{const u=new SpeechSynthesisUtterance(x.t);const v=voiceFor(x.l);if(v)u.voice=v;u.lang=x.l==="pt"?"pt-BR":"en-US";u.rate=x.slow?.6:.86;u.pitch=1.18;u.volume=1;u.onend=fin;u.onerror=fin;setTimeout(fin,1800+x.t.length*(x.slow?170:110));speechSynthesis.speak(u)}catch(e){fin()}})),Promise.resolve())}
function say(parts){ // parts: [{t:"text", l:"en"|"pt", slow:bool}]
  const my=++tok;parts=parts.filter(x=>x&&x.t);
  if(muted||!parts.length){stopVoice(true);return Promise.resolve()}
  const stage=$("#stage");stage.classList.add("talking");
  const end=()=>{if(my===tok)stage.classList.remove("talking")};
  let p;
  if(ctts){try{if(hasWeb)speechSynthesis.cancel()}catch(e){}
    p=ctts.speak(parts.map(x=>({text:x.t,voice:"airy",rate:x.slow?.72:.92,language:x.l==="pt"?"pt-BR":"en"}))).catch(err=>{if(err&&err.code==="not_granted"){ctts=null;if(my===tok)return webSay(parts,my)}})}
  else p=webSay(parts,my);
  return p.then(end,end)}
function stopVoice(keepTok){if(!keepTok)tok++;try{if(ctts)ctts.stop()}catch(e){}try{if(hasWeb)speechSynthesis.cancel()}catch(e){}$("#stage").classList.remove("talking")}

function startMemory(m){const set=shuffle(m.data).slice(0,6);const cards=shuffle(set.flatMap((v,i)=>[{id:i,k:"e",v},{id:i,k:"w",v}]));

    luna(pick(PRAISE),c.v.en+" = "+c.v.pt,[E(c.v.en)],"happy");

  else{run.lock=true;run.miss++;say([E(c.v.en)]);
    if(run.miss%3===0){giggle();const j=pick(MEM_J);luna("Hee hee!",j,null,"laugh");setTimeout(()=>{if(run&&run.type==="memory")say([P(j)])},850)}
    setTimeout(()=>{[a,b].forEach(x=>{x.el.classList.remove("up","e","w");x.el.textContent="🌙"});if(run)run.lock=false},1000)}}

/* ---------- sentence builder ---------- */
function startBuild(m){run={m,type:"build",items:shuffle(m.data).slice(0,5),i:0,first:0};showBuild(true)}
function showBuild(isFirst){const it=run.items[run.i];run.missed=false;run.done=false;run.ans=[];
  const words=it.en.split(" ");let pool=shuffle(words.map((t,i)=>({t,i})));if(pool.every((x,i)=>x.i===i))pool.reverse();run.pool=pool;
  luna(isFirst?"Make the sentence!":"Next one!","Toque nas palavras na ordem certa.",isFirst?[E("Make the sentence!"),P("Toque nas palavras na ordem certa.")]:[E("Next one!")]);
  lastSaid=[P(it.pt)];
  $("#view").innerHTML='<div class="prog"><i style="width:'+(run.i/run.items.length*100)+'%"></i></div><div class="qcard"><div class="sub">Em português</div><div class="q" style="font-size:20px">'+esc(it.pt)+'</div><div class="hear"><button data-hint="1">🔊 Ouvir em inglês</button></div></div><div class="line" id="line"></div><div class="pool" id="pool"></div><div class="next" id="next"><button class="big" id="check" disabled>Check ✔</button></div>';drawBuild()}
function drawBuild(){$("#line").innerHTML=run.ans.map((x,n)=>'<button class="chip" data-un="'+n+'">'+esc(x.t)+"</button>").join("")||'<span class="ptline">Sua frase aparece aqui</span>';
  $("#pool").innerHTML=run.pool.map((x,n)=>'<button class="chip" data-pk="'+n+'">'+esc(x.t)+"</button>").join("");const c=$("#check");if(c)c.disabled=run.pool.length>0}
async function checkBuild(){const it=run.items[run.i];const got=run.ans.map(x=>x.t).join(" ");
  if(got===it.en){run.done=true;if(!run.missed)run.first++;ding();$("#line").classList.add("good");const pr=pick(PRAISE);luna(pr,it.en,[E(pr),E(it.en)],"happy");
    const last=run.i===run.items.length-1;$("#next").innerHTML='<button class="big mint" id="nextB">'+(last?"Ver minhas estrelas ⭐":"Next ➜")+"</button>";
    document.querySelector(".prog i").style.width=((run.i+1)/run.items.length*100)+"%";document.querySelectorAll("#line .chip").forEach(b=>b.disabled=true)}
  else{run.missed=true;giggle();const j=pick(BUILD_J),first=it.en.split(" ")[0],my=run.i;const l=$("#line");l.classList.remove("bad");void l.offsetWidth;l.classList.add("bad");
    const tip=j+" Dica: a primeira palavra é "+first+".";luna("Hee hee! Oops!",tip,null,"laugh");lastSaid=[P(j),E(first)];
    await wait(850);if(run&&run.type==="build"&&run.i===my&&!run.done)say([P(j+" Dica: a primeira palavra é"),E(first)])}}
function nextBuild(){run.i++;if(run.i>=run.items.length){const pct=run.first/run.items.length;finish(run.m,pct>=.8?3:pct>=.5?2:1,run.first+" de "+run.items.length+" frases certas de primeira.")}else showBuild(false)}

/* ---------- speak: the child talks, Luna listens ---------- */
function listen(onPart){return new Promise(res=>{stopVoice();let finals="",part="",done=false,timer=null,was=false;
  const fin=v=>{if(done)return;done=true;clearTimeout(timer);dictH=null;res(v)};
  if(dict){const d=dict;const stop=()=>{Promise.resolve().then(()=>d.stop()).catch(()=>{}).then(()=>setTimeout(()=>fin({alts:[(finals||part).trim()]}),120))};
    dictH=(k,v,why)=>{if(k==="final"){finals+=v;onPart(finals.trim());clearTimeout(timer);timer=setTimeout(stop,1100)}else if(k==="partial"){if(v){part=v;onPart((finals+" "+v).trim())}}else if(k==="state"){if(v==="listening")was=true;else if(v==="idle"&&was)setTimeout(()=>fin({alts:[(finals||part).trim()]}),150)}};
    timer=setTimeout(stop,7000);
    d.start({language:"en"}).catch(e=>{const c=e&&e.code;if(c==="not_granted"||c==="unavailable")dict=null;if(c!=="stopped")fin({err:c||"error"})})}
  else{let alts=[];try{const r=new SR();r.lang="en-US";r.interimResults=true;r.maxAlternatives=5;
      r.onresult=e=>{const rs=e.results[e.results.length-1];alts=Array.from(rs).map(a=>a.transcript);if(alts[0])onPart(alts[0])};
      r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){srDead=true;fin({err:"blocked"})}};
      r.onend=()=>fin({alts});r.start();timer=setTimeout(()=>{try{r.stop()}catch(e){}},7000)}catch(e){srDead=true;fin({err:"blocked"})}}})}
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function closeTo(h,t){h=norm(h);t=norm(t);if(!h)return false;if(h===t||(" "+h+" ").includes(" "+t+" "))return true;if(1-lev(h,t)/Math.max(h.length,t.length)>=.75)return true;const tw=t.split(" ");if(tw.length>1){const hw=new Set(h.split(" "));return tw.filter(x=>hw.has(x)).length/tw.length>=.8}return false}
function startSpeak(m){run={m,type:"speak",items:shuffle(m.data).slice(0,6),i:0,first:0};showSpeak(true)}
function showSpeak(isFirst,keep){const it=run.items[run.i];if(!keep)run.tries=0;run.done=false;run.busy=false;const mode=micMode();
  const pt=mode?"Escute, toque no microfone e fale em inglês.":"Escute e repita em voz alta.";
  luna(isFirst?"Say it with me!":"Your turn!",pt,(isFirst?[E("Say it with me!"),P(pt)]:[]).concat([E(it.en)]));lastSaid=[E(it.en)];
  $("#view").innerHTML='<div class="prog"><i style="width:'+(run.i/run.items.length*100)+'%"></i></div>'+(mode?"":'<p class="note">O microfone não está disponível neste aparelho ou navegador. Fale em voz alta e toque em "Falei!".</p>')+'<div class="qcard"><div class="em">'+it.em+'</div><div class="q">'+esc(it.en)+'</div><div class="sub">'+esc(it.pt)+'</div><div class="hear"><button data-hear="1">🔊 Ouvir</button><button data-hear="slow">🐢 Devagar</button></div></div><div class="heard" id="heard"></div><div class="next" id="next">'+(mode?'<button class="big mic" id="mic">🎤 Falar</button>':'<button class="big mint" id="selfOk">Falei! ✔</button>')+"</div>"}
function speakNext(){const last=run.i===run.items.length-1;$("#next").innerHTML='<button class="big mint" id="nextS">'+(last?"Ver minhas estrelas ⭐":"Next ➜")+"</button>";document.querySelector(".prog i").style.width=((run.i+1)/run.items.length*100)+"%"}
async function tapMic(btn){if(!run||run.busy||run.done)return;run.busy=true;const my=run.i,it=run.items[my];
  btn.classList.add("on");btn.textContent="👂 Estou ouvindo…";$("#heard").textContent="";
  luna("I'm listening!","Pode falar: "+it.en,null);
  const r=await listen(t=>{const h=$("#heard");if(h)h.textContent="Eu ouvi: "+t});
  if(!run||run.type!=="speak"||run.i!==my)return;run.busy=false;
  if(r.err){if(!micMode()){showSpeak(false,true);return}btn.classList.remove("on");btn.textContent="🎤 Falar";const m="Não consegui abrir o microfone. Toque de novo e permita o uso do microfone.";luna("Oops!",m,[P(m)]);return}
  btn.classList.remove("on");btn.textContent="🎤 Falar de novo";
  const heard=(r.alts||[]).map(x=>String(x||"").trim()).filter(Boolean);
  if(!heard.length){const m="Não ouvi nada! Fale mais pertinho do celular, sem vergonha.";luna("I can't hear you!",m,[P(m)]);return}
  run.tries++;
  if(heard.some(x=>closeTo(x,it.en))){run.done=true;if(run.tries===1)run.first++;ding();$("#heard").textContent="Eu ouvi: "+it.en+" ✔";const pr=pick(PRAISE);luna(pr,"Eu entendi direitinho: "+it.en,[E(pr),E(it.en)],"happy");speakNext();return}
  giggle();const hw=heard[0];
  if(run.tries>=3){run.done=true;const m="Essa é difícil mesmo, e você tentou três vezes. Que coragem! Escute mais uma vez e vamos para a próxima.";luna("Good try!",m,null,"laugh");speakNext();await wait(850);if(run&&run.type==="speak"&&run.i===my)say([P(m),S(it.en)]);return}
  const j=pick(HEAR_J);luna("Hee hee!",j[0]+" \""+hw+"\"! "+j[1],null,"laugh");lastSaid=[E(it.en)];
  await wait(850);if(run&&run.type==="speak"&&run.i===my&&!run.busy)say([P(j[0]),E(hw),P(j[1]),S(it.en)])}
function selfOk(){if(run.done)return;run.done=true;run.first++;ding();const pr=pick(PRAISE);luna(pr,"Muito bem! Repita mais uma vez: "+run.items[run.i].en,[E(pr),E(run.items[run.i].en)],"happy");speakNext()}
function nextSpeak(){run.i++;if(run.i>=run.items.length){const pct=run.first/run.items.length;finish(run.m,pct>=.67?3:pct>=.34?2:1,run.first+" de "+run.items.length+" faladas certinho de primeira.")}else showSpeak(false)}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;audio();const d=t.dataset;
  if(t.id==="back"||d.home){home(false);return}
  if(t.id==="mute"){muted=!muted;t.textContent=muted?"🔇":"🔊";if(muted)stopVoice();else say([E("Hello!")]);return}
  if(t.id==="lunaBtn"){pop();if(lastSaid.length)say(lastSaid);return}
  if(d.m){start(d.m);return}
  if(d.story){start(d.story,true);return}
  if(!run)return;
  if(run.type==="story"){if(t.id==="sceneNext"){stopVoice();nextScene()}else if(t.id==="skipStory"){const m=run.m;storySeen();begin(m)}else if(t.id==="storyGo")begin(run.m);else if(t.id==="storyAgain")playStory(run.m,run.st,run.sid);return}
  if(d.fc!==undefined)tapLearn(+d.fc,t);
  else if(t.id==="learnDone")finish(run.m,3,"Você ouviu todas as palavras!");
  else if(d.hear){if(run.busy)return;const it=run.items[run.i];say([d.hear==="slow"?S(it.say):E(it.say)])}
  else if(d.o!==undefined)tapMC(+d.o,t);
  else if(t.id==="nextBtn")nextMC();
  else if(d.mc!==undefined)tapMem(+d.mc,t);
  else if(d.hint){run.missed=true;say([S(run.items[run.i].en)])}
  else if(d.pk!==undefined&&!run.done){pop();run.ans.push(run.pool.splice(+d.pk,1)[0]);drawBuild()}
  else if(d.un!==undefined&&!run.done){pop();run.pool.push(run.ans.splice(+d.un,1)[0]);drawBuild()}
  else if(t.id==="check")checkBuild();
  else if(t.id==="mic")tapMic(t);
  else if(t.id==="selfOk")selfOk();
  else if(t.id==="nextS")nextSpeak();
  else if(t.id==="nextB")nextBuild();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopVoice();try{if(dict&&dictH)dict.stop().catch(()=>{})}catch(e){}}});
if(save.seen)home(false);else welcome();
</script>
